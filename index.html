<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى شمس ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>

<div class="login-container">

    <div class="heart">♡</div>

    <h1>إلى شمس</h1>

    <p class="subtitle">
        كل إنجاز منكِ يفتح بابًا جديدًا...
    </p>

    <p class="hint">
        المرحلة الأولى بانتظارك
    </p>

    <input
        type="password"
        id="password"
        placeholder="أدخلي كلمة السر"
        autocomplete="off"
    >

    <button onclick="checkPassword()">
        فتح المرحلة ❤️
    </button>

    <p id="error"></p>

</div>

<script src="script.js"></script>

</body>
</html>
